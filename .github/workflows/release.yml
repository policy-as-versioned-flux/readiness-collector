name: release

# Ticket 10 (real-estate): builds and publishes this component's image on
# every semver tag, digest-addressable -- fleet's CronJob pins the
# resulting digest, same governed-dependency posture as every other
# component here. Published publicly (user-confirmed 2026-07-16, same
# standing consent covering c2p-collector, the app repos, and any
# remaining new component images this epic needs) -- a KiND demo cluster
# has no imagePullSecret.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push, tagged with the release version
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository }}"
          docker build -t "$IMG:${GITHUB_REF_NAME}" .
          docker push "$IMG:${GITHUB_REF_NAME}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG:${GITHUB_REF_NAME}")
          echo "Published: $digest"
          echo "$digest" >> "$GITHUB_STEP_SUMMARY"
